<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 7. Dynamic Random Conversation Game</title>
  <style>
    :root {
      --bg-color: #e0f7fa;
      --card-bg: #ffffff;
      --primary-color: #00838f;
      --accent-color: #ff7043;
      --system-bubble: #e1f5fe;
      --user-bubble: #fff3e0;
      --text-color: #37474f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'MaruBuri', 'Arial', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    
    header { text-align: center; margin-bottom: 15px; width: 100%; max-width: 800px; }
    h1 { color: var(--primary-color); font-size: 1.8rem; margin-bottom: 10px; }
    
    .controls { background: var(--card-bg); padding: 12px 20px; border-radius: 30px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex-wrap: wrap; }
    .speed-control { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: bold; }
    .btn { border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 0.9rem; }
    .btn-random { background-color: var(--primary-color); color: #fff; }
    .btn-random:hover { background-color: #006064; }

    .progress-bar-container { width: 100%; max-width: 800px; background: #b2ebf2; height: 8px; border-radius: 4px; margin-bottom: 15px; overflow: hidden; }
    .progress-bar { width: 0%; height: 100%; background: var(--primary-color); transition: width 0.3s ease; }

    main { width: 100%; max-width: 800px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.08); padding: 20px; display: flex; flex-direction: column; height: 540px; }
    
    .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 10px; }
    .message { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.3s ease; }
    .message.system { align-self: flex-start; }
    .message.user { align-self: flex-end; }
    
    .speaker-tag { font-size: 0.75rem; font-weight: bold; margin-bottom: 3px; color: #78909c; }
    .user .speaker-tag { text-align: right; }

    .bubble { padding: 12px 16px; border-radius: 18px; font-size: 1.05rem; line-height: 1.4; position: relative; }
    .system .bubble { background: var(--system-bubble); border-bottom-left-radius: 4px; color: #0277bd; }
    .user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; color: #e65100; }
    .sub-text { font-size: 0.8rem; color: #78909c; margin-top: 5px; }

    /* 블러 효과 */
    .blur-text {
      filter: blur(6px);
      cursor: pointer;
      transition: filter 0.25s ease, background-color 0.25s ease;
      background-color: rgba(0, 0, 0, 0.06);
      border-radius: 4px;
      padding: 2px 6px;
      user-select: none;
      display: inline-block;
    }
    .blur-text.revealed {
      filter: blur(0);
      background-color: transparent;
    }
    .blur-hint { font-size: 0.7rem; color: #90a4ae; margin-left: 5px; font-weight: normal; }

    .action-panel { border-top: 1px solid #eceff1; padding-top: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    
    .hint-box { background: #fffde7; border: 1px dashed #fbc02d; padding: 12px 18px; border-radius: 12px; font-size: 0.95rem; text-align: center; width: 100%; }
    .hint-title { font-weight: bold; color: #f57f17; margin-bottom: 4px; font-size: 0.85rem; }

    .mic-btn { width: 64px; height: 64px; border-radius: 50%; border: none; background: var(--accent-color); color: white; font-size: 1.6rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(255,112,67,0.4); transition: transform 0.2s; }
    .mic-btn.listening { animation: pulse 1.2s infinite; background: #e53935; }
    .status-text { font-size: 0.85rem; color: #78909c; font-weight: bold; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <h1>🎲 Lesson 7. 랜덤 대화 생성기 🍿</h1>
    <div class="controls">
      <div class="speed-control">
        <label for="speed">🔊 말하기 속도:</label>
        <input type="range" id="speed" min="0.6" max="1.1" step="0.1" value="0.9">
        <span id="speed-val">0.9</span>
      </div>
      <button class="btn btn-random" onclick="generateNewScenario()">🔄 새로운 랜덤 대화 생성</button>
    </div>
  </header>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progress"></div>
  </div>

  <main>
    <div class="chat-container" id="chat"></div>
    
    <div class="action-panel">
      <div class="hint-box" id="hint">
        <div class="hint-title">💡 [내 차례] 무엇을 말해야 할까요?</div>
        <div id="hint-content">준비가 되면 마이크 버튼을 눌러보세요!</div>
      </div>
      <button class="mic-btn" id="mic-btn" onclick="toggleListening()">🎤</button>
      <div class="status-text" id="status">마이크 버튼을 누르고 영어로 말해보세요! (글자는 클릭하면 노출됩니다)</div>
    </div>
  </main>

  <script>
    // 6학년 수준 랜덤 데이터 데이터베이스 (교과서 + 확장 어휘)
    const db = {
      events: [
        { en: "movie festival", kr: "영화 축제" },
        { en: "book festival", kr: "책 축제" },
        { en: "laser show", kr: "레이저 공연" },
        { en: "taekwondo show", kr: "태권도 공연" },
        { en: "birthday party", kr: "생일 잔치" },
        { en: "cooking class party", kr: "요리 교실 잔치" },
        { en: "star night party", kr: "별밤 파티" },
        { en: "free drinks party", kr: "무료 음료 잔치" },
        { en: "dance show", kr: "댄스 공연" },
        { en: "sports day", kr: "운동회" },
        { en: "game festival", kr: "게임 축제" },
        { en: "drone show", kr: "드론 쇼" }
      ],
      months: ["August", "September", "October", "November"],
      days: ["1st", "5th", "10th", "12th", "15th", "20th", "24th", "27th", "30th", "this Saturday", "this Sunday", "tomorrow"],
      places: [
        { en: "sports park", kr: "스포츠 공원" },
        { en: "river park", kr: "강가 공원" },
        { en: "school library", kr: "학교 도서관" },
        { en: "school kitchen", kr: "학교 조리실" },
        { en: "my house", kr: "우리 집" },
        { en: "city hall", kr: "시청" }
      ],
      times: ["at 10", "at 11", "at 2", "at 3", "at 5", "at 6"],
      reasons: [
        { en: "I have a baseball game.", kr: "나는 야구 경기가 있어.", key: "baseball game" },
        { en: "I have a basketball game.", kr: "나는 농구 경기가 있어.", key: "basketball game" },
        { en: "I have a soccer game.", kr: "나는 축구 경기가 있어.", key: "soccer game" },
        { en: "I visit my cousin every Saturday.", kr: "나는 토요일마다 사촌 집을 방문해.", key: "visit my cousin" },
        { en: "I have a piano exam.", kr: "나는 피아노 시험이 있어.", key: "piano exam" }
      ]
    };

    let activeDialogueSteps = [];
    let currentStepIdx = 0;
    let recognition;
    let isListening = false;

    // 유틸리티 함수: 무작위 추출
    function getRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function getRandomDateStr() {
      const day = getRandom(db.days);
      if (day.includes('this') || day === 'tomorrow') return day;
      return `${getRandom(db.months)} ${day}`;
    }

    // 대화 구조 무작위 생성 엔진
    function generateNewScenario() {
      const flowType = Math.floor(Math.random() * 3); // 3가지 패턴 중 무작위 선택
      const event1 = getRandom(db.events);
      const event2 = getRandom(db.events);
      const date1 = getRandomDateStr();
      const date2 = getRandomDateStr();
      const place = getRandom(db.places);
      const time = getRandom(db.times);
      const reason = getRandom(db.reasons);

      activeDialogueSteps = [];

      if (flowType === 0) {
        // Pattern 0: 내가 친구를 먼저 초대 ➔ 날짜 안내 ➔ 약속 확정
        activeDialogueSteps = [
          {
            initialSystemEn: `I love ${event1.en}!`,
            initialSystemKr: `나 ${event1.kr} 정말 좋아해!`,
            instruction: `1. 친구에게 ${event1.kr}에 올 수 있는지 물어보세요!`,
            hintEn: `Can you come to the ${event1.en}?`,
            hintKr: `너 ${event1.kr}에 올 수 있니?`,
            target: [`can you come to the ${event1.en}`, `come to the ${event1.en}`],
            systemReplyEn: `Of course! When is the ${event1.en}?`,
            systemReplyKr: `물론이지! ${event1.kr}가 언제니?`
          },
          {
            instruction: `2. 날짜(${date1})를 알려주세요!`,
            hintEn: `It's on ${date1}.`,
            hintKr: `${date1}이야.`,
            target: [`its on ${date1}`, date1.toLowerCase()],
            systemReplyEn: `Great! Where should we meet?`,
            systemReplyKr: `좋아! 어디서 만날까?`
          },
          {
            instruction: `3. 장소와 시간(${place.kr}, ${time})을 알려주세요!`,
            hintEn: `Come to the ${place.en} ${time}.`,
            hintKr: `${time}에 ${place.kr}(으)로 와.`,
            target: [`come to the ${place.en}`, place.en.toLowerCase(), time.toLowerCase()],
            systemReplyEn: `Okay, I will! See you then!`,
            systemReplyKr: `알았어, 그럴게. 그때 보자!`
          }
        ];
      } else if (flowType === 1) {
        // Pattern 1: 친구가 나를 초대 ➔ 거절 ➔ 다른 이벤트 초대 ➔ 수락
        activeDialogueSteps = [
          {
            initialSystemEn: `Can you come to the ${event1.en}? It's on ${date1}.`,
            initialSystemKr: `너 ${event1.kr}에 올 수 있니? ${date1}이야.`,
            instruction: `1. (${reason.kr}) 이유를 대며 미안하지만 못 간다고 거절해보세요!`,
            hintEn: `Sorry, but I can't. ${reason.en}`,
            hintKr: `미안하지만 안 되겠어. ${reason.kr}`,
            target: ["sorry", reason.key.toLowerCase()],
            systemReplyEn: `That's okay. Then can you come to the ${event2.en} on ${date2}?`,
            systemReplyKr: `괜찮아. 그럼 ${date2}에 있는 ${event2.kr}에는 올 수 있니?`
          },
          {
            instruction: `2. 기쁘게 수락해보세요!`,
            hintEn: `Of course!`,
            hintKr: `물론이지!`,
            target: ["of course", "sure", "id love to"],
            systemReplyEn: `Awesome! Come to the ${place.en} ${time}.`,
            systemReplyKr: `신난다! ${time}에 ${place.kr}(으)로 와.`
          },
          {
            instruction: `3. 알겠다고 최종 확인해보세요!`,
            hintEn: `Okay, I will.`,
            hintKr: `알았어, 그럴게.`,
            target: ["okay i will", "okay", "i will"],
            systemReplyEn: `Great! See you soon!`,
            systemReplyKr: `좋아! 곧 보자!`
          }
        ];
      } else {
        // Pattern 2: 친구의 물음에 수락 ➔ 장소/시간 안내받음 ➔ 확인
        activeDialogueSteps = [
          {
            initialSystemEn: `Can you come to my ${event1.en}? It's ${date1}.`,
            initialSystemKr: `너 내 ${event1.kr}에 올 수 있니? ${date1}이야.`,
            instruction: `1. 당연히 갈 수 있다고 수락해보세요!`,
            hintEn: `Of course! I'd love to.`,
            hintKr: `물론이지! 꼭 가고 싶어.`,
            target: ["of course", "sure", "love to"],
            systemReplyEn: `Great! Come to ${place.en} ${time}.`,
            systemReplyKr: `좋아! ${time}에 ${place.kr}(으)로 와.`
          },
          {
            instruction: `2. 알겠다고 대답하며 약속을 마무리해보세요!`,
            hintEn: `Okay, I will.`,
            hintKr: `알았어, 그럴게.`,
            target: ["okay i will", "okay", "i will"],
            systemReplyEn: `See you there!`,
            systemReplyKr: `거기서 보자!`
          }
        ];
      }

      resetChatUI();
    }

    window.onload = () => {
      initSTT();
      generateNewScenario();

      document.getElementById('speed').addEventListener('input', (e) => {
        document.getElementById('speed-val').innerText = e.target.value;
      });
    };

    function resetChatUI() {
      document.getElementById('chat').innerHTML = '';
      currentStepIdx = 0;
      updateProgress();

      const current = activeDialogueSteps[currentStepIdx];
      if (current.initialSystemEn) {
        setTimeout(() => {
          addMessage('system', current.initialSystemEn, current.initialSystemKr);
          speak(current.initialSystemEn);
          showUserTurnHint();
        }, 400);
      } else {
        showUserTurnHint();
      }
    }

    function updateProgress() {
      const pct = (currentStepIdx / activeDialogueSteps.length) * 100;
      document.getElementById('progress').style.width = `${pct}%`;
    }

    function showUserTurnHint() {
      if (currentStepIdx >= activeDialogueSteps.length) return;

      const current = activeDialogueSteps[currentStepIdx];
      
      document.getElementById('hint').innerHTML = `
        <div class="hint-title">💡 ${current.instruction}</div>
        <div style="margin-top: 5px;">
          <span class="blur-text" onclick="toggleBlur(this)">
            ${current.hintEn} <br><small>(${current.hintKr})</small>
          </span>
          <span class="blur-hint">👈 클릭해서 힌트 보기</span>
        </div>
      `;
    }

    function addMessage(sender, text, subText) {
      const chat = document.getElementById('chat');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      
      const speakerName = sender === 'system' ? '🤖 친구' : '👤 나';
      
      msgDiv.innerHTML = `
        <div class="speaker-tag">${speakerName}</div>
        <div class="bubble">
          <span class="blur-text" onclick="toggleBlur(this)">${text}</span>
        </div>
        <div class="sub-text">
          <span class="blur-text" onclick="toggleBlur(this)">${subText || ''}</span>
        </div>
      `;
      
      chat.appendChild(msgDiv);
      chat.scrollTop = chat.scrollHeight;
    }

    function toggleBlur(element) {
      element.classList.toggle('revealed');
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = parseFloat(document.getElementById('speed').value);
      window.speechSynthesis.speak(utterance);
    }

    function initSTT() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 브라우저를 사용해 주세요.');
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('mic-btn').classList.add('listening');
        document.getElementById('status').innerText = '듣고 있어요... 말씀해 주세요!';
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('mic-btn').classList.remove('listening');
        document.getElementById('status').innerText = '마이크 버튼을 누르고 영어로 말해보세요!';
      };

      recognition.onresult = (event) => {
        const userSpeech = event.results[0][0].transcript;
        handleUserSpeech(userSpeech);
      };
    }

    function toggleListening() {
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function handleUserSpeech(speech) {
      const current = activeDialogueSteps[currentStepIdx];
      
      addMessage('user', speech, '내가 한 말');

      const cleanSpeech = speech.toLowerCase().replace(/[^a-z0-9 ]/g, '');
      const isCorrect = current.target.some(target => cleanSpeech.includes(target.toLowerCase()));

      if (isCorrect) {
        currentStepIdx++;
        updateProgress();

        setTimeout(() => {
          addMessage('system', current.systemReplyEn, current.systemReplyKr);
          speak(current.systemReplyEn);

          if (currentStepIdx < activeDialogueSteps.length) {
            setTimeout(showUserTurnHint, 1800);
          } else {
            document.getElementById('progress').style.width = '100%';
            document.getElementById('hint').innerHTML = `
              <div class="hint-title">🎉 완벽합니다! 성공적으로 대화를 마쳤습니다!</div>
              <div>상단의 '🔄 새로운 랜덤 대화 생성' 버튼을 눌러 또 다른 대화를 연습해보세요!</div>
            `;
          }
        }, 1000);

      } else {
        document.getElementById('status').innerText = '핵심 단어가 인식되지 않았어요. 힌트를 확인하고 다시 시도해보세요!';
      }
    }
  </script>
</body>
</html>
