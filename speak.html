<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 7. Stage Game - Fuzzy Matching Mode</title>
  <style>
    :root {
      --bg-color: #e0f7fa;
      --card-bg: #ffffff;
      --primary-color: #00838f;
      --accent-color: #ff7043;
      --system-bubble: #e1f5fe;
      --user-bubble: #fff3e0;
      --text-color: #37474f;
      --stage-color: #ffb300;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'MaruBuri', 'Arial', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    
    header { text-align: center; margin-bottom: 12px; width: 100%; max-width: 800px; }
    h1 { color: var(--primary-color); font-size: 1.8rem; margin-bottom: 8px; }
    
    .status-bar { display: flex; gap: 15px; justify-content: center; align-items: center; margin-bottom: 10px; }
    .stage-badge { background: var(--stage-color); color: #fff; font-size: 1.2rem; font-weight: bold; padding: 6px 18px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

    .controls { background: var(--card-bg); padding: 10px 20px; border-radius: 30px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .speed-control { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: bold; }
    .btn { border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 0.85rem; }
    .btn-reset { background-color: #eceff1; color: #455a64; }
    .btn-reset:hover { background-color: #cfd8dc; }

    .progress-bar-container { width: 100%; max-width: 800px; background: #b2ebf2; height: 8px; border-radius: 4px; margin-bottom: 15px; overflow: hidden; }
    .progress-bar { width: 0%; height: 100%; background: var(--primary-color); transition: width 0.3s ease; }

    main { width: 100%; max-width: 800px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.08); padding: 20px; display: flex; flex-direction: column; height: 530px; }
    
    .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 10px; }
    .message { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.3s ease; }
    .message.system { align-self: flex-start; }
    .message.user { align-self: flex-end; }
    
    .speaker-tag { font-size: 0.75rem; font-weight: bold; margin-bottom: 3px; color: #78909c; }
    .user .speaker-tag { text-align: right; }

    .bubble { padding: 12px 16px; border-radius: 18px; font-size: 1.05rem; line-height: 1.4; position: relative; }
    .system .bubble { background: var(--system-bubble); border-bottom-left-radius: 4px; color: #0277bd; }
    .user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; color: #e65100; }
    .sub-text { font-size: 0.8rem; color: #78909c; margin-top: 5px; }

    /* 블러 효과 */
    .blur-text {
      filter: blur(6px);
      cursor: pointer;
      transition: filter 0.25s ease, background-color 0.25s ease;
      background-color: rgba(0, 0, 0, 0.06);
      border-radius: 4px;
      padding: 2px 6px;
      user-select: none;
      display: inline-block;
    }
    .blur-text.revealed {
      filter: blur(0);
      background-color: transparent;
    }
    .blur-hint { font-size: 0.7rem; color: #90a4ae; margin-left: 5px; font-weight: normal; }

    .action-panel { border-top: 1px solid #eceff1; padding-top: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    
    .hint-box { background: #fffde7; border: 1.5px dashed #fbc02d; padding: 12px 18px; border-radius: 12px; font-size: 0.95rem; text-align: center; width: 100%; }
    .hint-title { font-weight: bold; color: #d81b60; margin-bottom: 6px; font-size: 0.9rem; }
    .badge-tag { display: inline-block; background: #e1f5fe; color: #0288d1; font-weight: bold; padding: 2px 8px; border-radius: 6px; font-size: 0.8rem; margin-right: 4px; }

    .mic-btn { width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--accent-color); color: white; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(255,112,67,0.4); transition: transform 0.2s; }
    .mic-btn.listening { animation: pulse 1.2s infinite; background: #e53935; }
    .status-text { font-size: 0.85rem; color: #78909c; font-weight: bold; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <h1>🎮 Lesson 7. 무한 스테이지 챌린지 🍿</h1>
    <div class="status-bar">
      <div class="stage-badge" id="stage-badge">🏆 STAGE 1</div>
    </div>
    <div class="controls">
      <div class="speed-control">
        <label for="speed">🔊 속도:</label>
        <input type="range" id="speed" min="0.6" max="1.1" step="0.1" value="0.9">
        <span id="speed-val">0.9</span>
      </div>
      <button class="btn btn-reset" onclick="resetToStage1()">🔄 Stage 1부터 다시하기</button>
    </div>
  </header>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progress"></div>
  </div>

  <main>
    <div class="chat-container" id="chat"></div>
    
    <div class="action-panel">
      <div class="hint-box" id="hint">
        <div class="hint-title">💡 [내 차례] 무엇을 말해야 할까요?</div>
        <div id="hint-content">준비가 되면 마이크 버튼을 눌러보세요!</div>
      </div>
      <button class="mic-btn" id="mic-btn" onclick="toggleListening()">🎤</button>
      <div class="status-text" id="status">마이크를 누르고 말해보세요!</div>
    </div>
  </main>

  <script>
    const db = {
      events: [
        { en: "movie festival", kr: "영화 축제" },
        { en: "book festival", kr: "책 축제" },
        { en: "laser show", kr: "레이저 공연" },
        { en: "taekwondo show", kr: "태권도 공연" },
        { en: "birthday party", kr: "생일 잔치" },
        { en: "cooking class party", kr: "요리 교실 잔치" },
        { en: "star night party", kr: "별밤 파티" },
        { en: "free drinks party", kr: "무료 음료 잔치" },
        { en: "drone show", kr: "드론 쇼" }
      ],
      months: ["August", "September", "October", "November"],
      days: ["1st", "5th", "10th", "12th", "15th", "20th", "24th", "27th", "30th", "this Saturday", "tomorrow"],
      places: [
        { en: "sports park", kr: "스포츠 공원" },
        { en: "river park", kr: "강가 공원" },
        { en: "school library", kr: "학교 도서관" },
        { en: "school kitchen", kr: "학교 조리실" },
        { en: "my house", kr: "우리 집" }
      ],
      times: ["at 10", "at 11", "at 2", "at 3", "at 5", "at 6"],
      reasons: [
        { en: "I have a baseball game.", kr: "나는 야구 경기가 있어.", key: "baseball game" },
        { en: "I have a basketball game.", kr: "나는 농구 경기가 있어.", key: "basketball game" },
        { en: "I visit my cousin every Saturday.", kr: "나는 토요일마다 사촌 집을 방문해.", key: "visit my cousin" }
      ]
    };

    // STT 오인식 보정 맵
    const sttFixMap = {
      "throne": "drone",
      "thrown": "drone",
      "drawn": "drone",
      "lazer": "laser",
      "take one do": "taekwondo"
    };

    let stage = 1;
    let activeDialogueSteps = [];
    let currentStepIdx = 0;
    let recognition;
    let isListening = false;
    let isFailedState = false;

    function getRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function getRandomDateStr() {
      const day = getRandom(db.days);
      if (day.includes('this') || day === 'tomorrow') return day;
      return `${getRandom(db.months)} ${day}`;
    }

    // 유사도 계산 (Levenshtein Distance)
    function getSimilarity(s1, s2) {
      const len1 = s1.length;
      const len2 = s2.length;
      const matrix = Array.from({ length: len1 + 1 }, () => Array(len2 + 1).fill(0));

      for (let i = 0; i <= len1; i++) matrix[i][0] = i;
      for (let j = 0; j <= len2; j++) matrix[0][j] = j;

      for (let i = 1; i <= len1; i++) {
        for (let j = 1; j <= len2; j++) {
          const cost = s1[i - 1] === s2[j - 1] ? 0 : 1;
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }
      const maxLen = Math.max(len1, len2);
      return maxLen === 0 ? 1 : 1 - matrix[len1][len2] / maxLen;
    }

    // STT 입력 정제 및 단어 치환
    function cleanAndFixSTT(text) {
      let cleaned = text.toLowerCase().replace(/[^a-z0-9 ]/g, '');
      for (const [wrong, right] of Object.entries(sttFixMap)) {
        cleaned = cleaned.replace(new RegExp(`\\b${wrong}\\b`, 'g'), right);
      }
      return cleaned;
    }

    function generateScenario() {
      isFailedState = false;
      const flowType = Math.floor(Math.random() * 3);
      const event1 = getRandom(db.events);
      const event2 = getRandom(db.events);
      const date1 = getRandomDateStr();
      const date2 = getRandomDateStr();
      const place = getRandom(db.places);
      const time = getRandom(db.times);
      const reason = getRandom(db.reasons);

      activeDialogueSteps = [];

      if (flowType === 0) {
        activeDialogueSteps = [
          {
            initialSystemEn: `I love ${event1.en}!`,
            initialSystemKr: `나 ${event1.kr} 정말 좋아해!`,
            instruction: `[초대 질문] 친구에게 ${event1.kr}에 올 수 있는지 물어보세요!`,
            hintEn: `Can you come to the ${event1.en}?`,
            hintKr: `너 ${event1.kr}에 올 수 있니?`,
            target: [`can you come to the ${event1.en}`, `come to the ${event1.en}`],
            systemReplyEn: `Of course! When is the ${event1.en}?`,
            systemReplyKr: `물론이지! ${event1.kr}가 언제니?`
          },
          {
            instruction: `[날짜 안내] 날짜(${date1})를 알려주세요!`,
            hintEn: `It's on ${date1}.`,
            hintKr: `${date1}이야.`,
            target: [`its on ${date1}`, date1.toLowerCase()],
            systemReplyEn: `Great! Come to the ${place.en} ${time}.`,
            systemReplyKr: `좋아! ${time}에 ${place.kr}(으)로 와.`
          },
          {
            instruction: `[약속 동의] "~로 오라"는 친구 지시에 "알았어, 그럴게!"라고 대답해보세요!`,
            typeBadge: "약속 동의 ➔ Okay, I will 사용!",
            hintEn: `Okay, I will.`,
            hintKr: `[장소/시간 지시에 동의할 때] 알았어, 그럴게.`,
            target: ["okay i will", "okay", "i will"],
            systemReplyEn: `See you then!`,
            systemReplyKr: `그때 보자!`
          }
        ];
      } else if (flowType === 1) {
        activeDialogueSteps = [
          {
            initialSystemEn: `Can you come to the ${event1.en}? It's on ${date1}.`,
            initialSystemKr: `너 ${event1.kr}에 올 수 있니? ${date1}이야.`,
            instruction: `[거절하기] (${reason.kr}) 이유를 대며 못 간다고 거절해 보세요!`,
            hintEn: `Sorry, but I can't. ${reason.en}`,
            hintKr: `미안하지만 안 되겠어. ${reason.kr}`,
            target: ["sorry", reason.key.toLowerCase()],
            systemReplyEn: `That's okay. Then can you come to the ${event2.en} on ${date2}?`,
            systemReplyKr: `괜찮아. 그럼 ${date2}에 있는 ${event2.kr}에는 올 수 있니?`
          },
          {
            instruction: `[초대 승낙] 친구의 초대에 "물론이지!"라고 승낙해 보세요!`,
            typeBadge: "초대 승낙 ➔ Of course 사용!",
            hintEn: `Of course!`,
            hintKr: `[초대에 승낙할 때] 물론이지!`,
            target: ["of course", "sure"],
            systemReplyEn: `Awesome! Come to the ${place.en} ${time}.`,
            systemReplyKr: `신난다! ${time}에 ${place.kr}(으)로 와.`
          },
          {
            instruction: `[약속 동의] 몇 시까지 오라는 말에 "알았어, 그럴게!"라고 약속해보세요!`,
            typeBadge: "약속 동의 ➔ Okay, I will 사용!",
            hintEn: `Okay, I will.`,
            hintKr: `[장소/시간 지시에 동의할 때] 알았어, 그럴게.`,
            target: ["okay i will", "okay", "i will"],
            systemReplyEn: `Great! See you soon!`,
            systemReplyKr: `좋아! 곧 보자!`
          }
        ];
      } else {
        activeDialogueSteps = [
          {
            initialSystemEn: `Can you come to my ${event1.en}? It's ${date1}.`,
            initialSystemKr: `너 내 ${event1.kr}에 올 수 있니? ${date1}이야.`,
            instruction: `[초대 승낙] 친구의 초대에 "물론이지!"라고 승낙해 보세요!`,
            typeBadge: "초대 승낙 ➔ Of course 사용!",
            hintEn: `Of course!`,
            hintKr: `[초대에 승낙할 때] 물론이지!`,
            target: ["of course", "sure"],
            systemReplyEn: `Great! Come to ${place.en} ${time}.`,
            systemReplyKr: `좋아! ${time}에 ${place.kr}(으)로 와.`
          },
          {
            instruction: `[약속 동의] 어디로 오라는 말에 "알았어, 그럴게!"라고 최종 답변해 보세요!`,
            typeBadge: "약속 동의 ➔ Okay, I will 사용!",
            hintEn: `Okay, I will.`,
            hintKr: `[장소/시간 지시에 동의할 때] 알았어, 그럴게.`,
            target: ["okay i will", "okay", "i will"],
            systemReplyEn: `See you there!`,
            systemReplyKr: `거기서 보자!`
          }
        ];
      }

      resetChatUI();
    }

    window.onload = () => {
      initSTT();
      generateScenario();

      document.getElementById('speed').addEventListener('input', (e) => {
        document.getElementById('speed-val').innerText = e.target.value;
      });
    };

    function resetToStage1() {
      stage = 1;
      document.getElementById('stage-badge').innerText = `🏆 STAGE 1`;
      generateScenario();
    }

    function resetChatUI() {
      document.getElementById('chat').innerHTML = '';
      currentStepIdx = 0;
      updateProgress();

      const current = activeDialogueSteps[currentStepIdx];
      if (current.initialSystemEn) {
        setTimeout(() => {
          addMessage('system', current.initialSystemEn, current.initialSystemKr);
          speak(current.initialSystemEn);
          showUserTurnHint();
        }, 400);
      } else {
        showUserTurnHint();
      }
    }

    function updateProgress() {
      const pct = (currentStepIdx / activeDialogueSteps.length) * 100;
      document.getElementById('progress').style.width = `${pct}%`;
    }

    function showUserTurnHint() {
      if (currentStepIdx >= activeDialogueSteps.length) return;

      const current = activeDialogueSteps[currentStepIdx];
      const badgeHtml = current.typeBadge ? `<div style="margin-bottom:4px;"><span class="badge-tag">${current.typeBadge}</span></div>` : '';

      document.getElementById('hint').innerHTML = `
        ${badgeHtml}
        <div class="hint-title">💡 ${current.instruction}</div>
        <div style="margin-top: 5px;">
          <span class="blur-text" onclick="toggleBlur(this)">
            ${current.hintEn} <br><small>(${current.hintKr})</small>
          </span>
          <span class="blur-hint">👈 클릭해서 힌트 보기</span>
        </div>
      `;
    }

    function addMessage(sender, text, subText) {
      const chat = document.getElementById('chat');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      
      const speakerName = sender === 'system' ? '🤖 친구' : '👤 나';
      
      msgDiv.innerHTML = `
        <div class="speaker-tag">${speakerName}</div>
        <div class="bubble">
          <span class="blur-text" onclick="toggleBlur(this)">${text}</span>
        </div>
        <div class="sub-text">
          <span class="blur-text" onclick="toggleBlur(this)">${subText || ''}</span>
        </div>
      `;
      
      chat.appendChild(msgDiv);
      chat.scrollTop = chat.scrollHeight;
    }

    function toggleBlur(element) {
      element.classList.toggle('revealed');
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = parseFloat(document.getElementById('speed').value);
      window.speechSynthesis.speak(utterance);
    }

    function initSTT() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 브라우저를 사용해 주세요.');
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('mic-btn').classList.add('listening');
        document.getElementById('status').innerText = '듣고 있어요... 말씀해 주세요!';
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('mic-btn').classList.remove('listening');
      };

      recognition.onresult = (event) => {
        const userSpeech = event.results[0][0].transcript;
        handleUserSpeech(userSpeech);
      };
    }

    function toggleListening() {
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function handleUserSpeech(speech) {
      const current = activeDialogueSteps[currentStepIdx];
      addMessage('user', speech, '내가 한 말');

      const cleanSpeech = cleanAndFixSTT(speech);

      // 정답 판정: 1) 포함 여부 2) 문장 유사도 70% 이상
      const isCorrect = current.target.some(target => {
        const cleanTarget = cleanAndFixSTT(target);
        if (cleanSpeech.includes(cleanTarget)) return true;
        return getSimilarity(cleanSpeech, cleanTarget) >= 0.7;
      });

      // 오답 후 따라 말하기 상태
      if (isFailedState) {
        if (isCorrect) {
          document.getElementById('status').innerText = '👍 정답을 잘 따라 하셨습니다! Stage 1부터 다시 시작합니다.';
          stage = 1;
          document.getElementById('stage-badge').innerText = `🏆 STAGE 1`;
          speak("Good job! Starting again from stage 1.");
          
          setTimeout(() => {
            generateScenario();
          }, 2000);
        } else {
          document.getElementById('status').innerText = '❌ 아직 정답 문장과 다릅니다. 화면에 보이는 정답을 읽어보세요!';
          speak(current.hintEn);
        }
        return;
      }

      // 일반 진행
      if (isCorrect) {
        currentStepIdx++;
        updateProgress();

        setTimeout(() => {
          addMessage('system', current.systemReplyEn, current.systemReplyKr);
          speak(current.systemReplyEn);

          if (currentStepIdx < activeDialogueSteps.length) {
            setTimeout(showUserTurnHint, 1800);
          } else {
            // Stage Clear
            stage++;
            document.getElementById('stage-badge').innerText = `🏆 STAGE ${stage}`;
            document.getElementById('progress').style.width = '100%';
            document.getElementById('hint').innerHTML = `
              <div class="hint-title" style="color:#2e7d32; font-size:1.1rem;">🎉 STAGE ${stage - 1} 클리어!</div>
              <div>축하합니다! 잠시 후 다음 스테이지가 시작됩니다.</div>
            `;
            setTimeout(() => {
              generateScenario();
            }, 2500);
          }
        }, 1000);

      } else {
        // 오답 발생시
        isFailedState = true;
        document.getElementById('status').innerText = '❌ 틀렸습니다! 정답을 똑같이 따라 말해야 Stage 1부터 재시작됩니다.';
        
        document.getElementById('hint').innerHTML = `
          <div class="hint-title" style="color:#d32f2f;">💥 틀렸습니다! 아래 정답을 따라 말해보세요.</div>
          <div style="font-size: 1.15rem; font-weight: bold; margin: 8px 0; color: #1565c0; background: #e3f2fd; padding: 8px; border-radius: 8px;">
            🗣️ "${current.hintEn}"
          </div>
          <div style="color: #555; font-size: 0.9rem;">(${current.hintKr})</div>
          <div style="margin-top: 8px; font-size: 0.85rem; color: #d81b60; font-weight: bold;">
            👇 마이크를 누르고 위 문장을 읽어주세요!
