<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson 7. Full Conversation Master</title>
  <style>
    :root {
      --bg-color: #e0f7fa;
      --card-bg: #ffffff;
      --primary-color: #00838f;
      --accent-color: #ff7043;
      --system-bubble: #e1f5fe;
      --user-bubble: #fff3e0;
      --text-color: #37474f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'MaruBuri', 'Arial', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    
    header { text-align: center; margin-bottom: 15px; width: 100%; max-width: 800px; }
    h1 { color: var(--primary-color); font-size: 1.8rem; margin-bottom: 10px; }
    
    .controls { background: var(--card-bg); padding: 12px 20px; border-radius: 30px; display: flex; align-items: center; justify-content: space-between; gap: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .speed-control { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: bold; }
    .btn { border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-reset { background-color: #eceff1; color: #455a64; }
    .btn-reset:hover { background-color: #cfd8dc; }

    .scene-nav { display: flex; gap: 6px; overflow-x: auto; width: 100%; max-width: 800px; margin-bottom: 12px; padding: 4px 0; }
    .scene-btn { background: #ffffff; border: 1.5px solid var(--primary-color); color: var(--primary-color); padding: 6px 12px; border-radius: 12px; cursor: pointer; font-size: 0.82rem; white-space: nowrap; font-weight: bold; }
    .scene-btn.active { background: var(--primary-color); color: #ffffff; }

    .progress-bar-container { width: 100%; max-width: 800px; background: #b2ebf2; height: 8px; border-radius: 4px; margin-bottom: 15px; overflow: hidden; }
    .progress-bar { width: 0%; height: 100%; background: var(--primary-color); transition: width 0.3s ease; }

    main { width: 100%; max-width: 800px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.08); padding: 20px; display: flex; flex-direction: column; height: 530px; }
    
    .chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 10px; }
    .message { display: flex; flex-direction: column; max-width: 82%; animation: fadeIn 0.3s ease; }
    .message.system { align-self: flex-start; }
    .message.user { align-self: flex-end; }
    
    .speaker-tag { font-size: 0.75rem; font-weight: bold; margin-bottom: 3px; color: #78909c; }
    .user .speaker-tag { text-align: right; }

    .bubble { padding: 12px 16px; border-radius: 18px; font-size: 1.05rem; line-height: 1.4; position: relative; }
    .system .bubble { background: var(--system-bubble); border-bottom-left-radius: 4px; color: #0277bd; }
    .user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; color: #e65100; }
    .sub-text { font-size: 0.8rem; color: #78909c; margin-top: 5px; }

    /* 블러 및 가리기 스타일 */
    .blur-text {
      filter: blur(6px);
      cursor: pointer;
      transition: filter 0.25s ease, background-color 0.25s ease;
      background-color: rgba(0, 0, 0, 0.06);
      border-radius: 4px;
      padding: 2px 6px;
      user-select: none;
      display: inline-block;
    }
    .blur-text.revealed {
      filter: blur(0);
      background-color: transparent;
    }
    .blur-hint { font-size: 0.7rem; color: #90a4ae; margin-left: 5px; font-weight: normal; }

    .action-panel { border-top: 1px solid #eceff1; padding-top: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    
    .hint-box { background: #fffde7; border: 1px dashed #fbc02d; padding: 12px 18px; border-radius: 12px; font-size: 0.95rem; text-align: center; width: 100%; }
    .hint-title { font-weight: bold; color: #f57f17; margin-bottom: 4px; font-size: 0.85rem; }

    .mic-btn { width: 64px; height: 64px; border-radius: 50%; border: none; background: var(--accent-color); color: white; font-size: 1.6rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(255,112,67,0.4); transition: transform 0.2s; }
    .mic-btn.listening { animation: pulse 1.2s infinite; background: #e53935; }
    .status-text { font-size: 0.85rem; color: #78909c; font-weight: bold; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <h1>🎬 Lesson 7. 단원 전체 대화 마스터 🍿</h1>
    <div class="controls">
      <div class="speed-control">
        <label for="speed">🔊 말하기 속도:</label>
        <input type="range" id="speed" min="0.6" max="1.1" step="0.1" value="0.9">
        <span id="speed-val">0.9</span>
      </div>
      <button class="btn btn-reset" onclick="resetChat()">🔄 처음부터 다시하기</button>
    </div>
  </header>

  <div class="scene-nav" id="scene-nav"></div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progress"></div>
  </div>

  <main>
    <div class="chat-container" id="chat"></div>
    
    <div class="action-panel">
      <div class="hint-box" id="hint">
        <div class="hint-title">💡 [내 차례] 무엇을 말해야 할까요?</div>
        <div id="hint-content">준비가 되면 마이크 버튼을 눌러보세요!</div>
      </div>
      <button class="mic-btn" id="mic-btn" onclick="toggleListening()">🎤</button>
      <div class="status-text" id="status">마이크 버튼을 누르고 말해보세요! (글자는 클릭하면 나타납니다)</div>
    </div>
  </main>

  <script>
    // 교과서 7단원 전체 대화 시나리오 (Fun Talk 1~2, Practice 1~2, Talk Like This, Let's Read 모음)
    const dialogueFlow = [
      // Scene 1: 영화 축제 초대 (Fun Talk 1)
      {
        sceneId: 1,
        sceneTitle: "1. 영화 축제 초대",
        initialSystemEn: "Oh, it's a movie festival. It looks fun!",
        initialSystemKr: "오, 영화 축제야. 재미있어 보인다!",
        instruction: "1. 영화 축제에 올 수 있는지 친구에게 물어보세요!",
        hintEn: "Can you come to the movie festival?",
        hintKr: "너 영화 축제에 올 수 있니?",
        target: ["can you come to the movie festival", "come to the movie festival"],
        systemReplyEn: "Of course! When is the festival?",
        systemReplyKr: "물론이지! 축제가 언제니?"
      },
      {
        sceneId: 1,
        instruction: "2. 축제 날짜(8월 27일)를 알려주세요!",
        hintEn: "It's on August 27th.",
        hintKr: "8월 27일이야.",
        target: ["its on august 27th", "august 27th", "august 27"],
        systemReplyEn: "Great! I can't wait!",
        systemReplyKr: "좋아! 정말 기대돼!"
      },

      // Scene 2: 태권도 공연 및 사촌 동반 (Fun Talk 2)
      {
        sceneId: 2,
        sceneTitle: "2. 태권도 공연 & 사촌",
        initialSystemEn: "How about you? Can you come to our taekwondo show?",
        initialSystemKr: "너는 어때? 우리의 태권도 공연에 올 수 있니?",
        instruction: "3. 공연이 언제인지 물어보세요!",
        hintEn: "When is the show?",
        hintKr: "공연이 언제니?",
        target: ["when is the show", "when is it"],
        systemReplyEn: "It's this Saturday. We'll have a pizza party after the show!",
        systemReplyKr: "이번 주 토요일이야. 공연 후에 피자 잔치도 할 거야!"
      },
      {
        sceneId: 2,
        instruction: "4. 사촌을 데려가도 될지 물어보세요!",
        hintEn: "Can I bring my cousin to the show?",
        hintKr: "나의 사촌을 공연에 데려가도 될까?",
        target: ["can i bring my cousin", "can i bring my cousin to the show", "bring my cousin"],
        systemReplyEn: "Of course. Come to the sports park at 10.",
        systemReplyKr: "물론이지. 10시에 스포츠 공원으로 와."
      },

      // Scene 3: 레이저 공연 및 농구/야구 경기 거절 (Talk Like This & Listen and Do)
      {
        sceneId: 3,
        sceneTitle: "3. 레이저 공연 & 거절",
        initialSystemEn: "Can you come to the laser show? It's on September 15th.",
        initialSystemKr: "너는 레이저 공연에 올 수 있니? 9월 15일이야.",
        instruction: "5. 농구 경기가 있어서 못 간다고 거절해보세요!",
        hintEn: "Sorry, but I can't. I have a basketball game.",
        hintKr: "미안하지만 안 되겠어. 나는 농구 경기가 있어.",
        target: ["sorry but i cant i have a basketball game", "sorry i cant i have a basketball game", "i have a basketball game"],
        systemReplyEn: "That's okay. Good luck!",
        systemReplyKr: "괜찮아. 행운을 빌게!"
      },

      // Scene 4: 요리 교실 잔치 & 장소/시간 안내 (Talk Like This)
      {
        sceneId: 4,
        sceneTitle: "4. 요리 교실 & 초콜릿 쿠키",
        initialSystemEn: "Can you come to the cooking class party? It's this Saturday.",
        initialSystemKr: "너는 요리 교실 잔치에 올 수 있니? 이번 주 토요일이야.",
        instruction: "6. 기쁘게 수락해 보세요!",
        hintEn: "Of course!",
        hintKr: "물론이지!",
        target: ["of course", "sure"],
        systemReplyEn: "We'll bake chocolate biscuits. Come to the school kitchen at 11.",
        systemReplyKr: "우리는 초콜릿 비스킷을 구울 거야. 11시에 학교 조리실로 와."
      },
      {
        sceneId: 4,
        instruction: "7. 알겠다고 약속을 최종 확인해보세요!",
        hintEn: "Okay, I will.",
        hintKr: "알았어, 그럴게.",
        target: ["okay i will", "okay", "i will"],
        systemReplyEn: "Great! See you at 11!",
        systemReplyKr: "좋아! 11시에 보자!"
      },

      // Scene 5: 별밤 파티 초대 (Let's Read)
      {
        sceneId: 5,
        sceneTitle: "5. 별밤 파티 (Star Night)",
        initialSystemEn: "Can you come to the Star Night Party? It's on September 29th.",
        initialSystemKr: "별밤 파티에 올래? 9월 29일이야.",
        instruction: "8. 시간을 물어보거나 수락 후 몇 시에 가야 하는지 물어보세요!",
        hintEn: "Of course! What time should I come?",
        hintKr: "물론이지! 몇 시에 가면 되니?",
        target: ["of course", "what time", "sure"],
        systemReplyEn: "Please come to my house at 5. We will have sandwiches and play games!",
        systemReplyKr: "5시에 우리 집으로 와. 샌드위치도 먹고 재미있는 게임도 할 거야!"
      },
      {
        sceneId: 5,
        instruction: "9. 알겠다고 인사해 보세요!",
        hintEn: "Okay, I will. See you then!",
        hintKr: "알았어, 그럴게. 그때 보자!",
        target: ["okay i will", "see you then", "okay"],
        systemReplyEn: "Awesome! Don't forget your lucky number is 5!",
        systemReplyKr: "신난다! 네 행운의 번호가 5번이라는 걸 잊지 마!"
      }
    ];

    let currentStepIdx = 0;
    let recognition;
    let isListening = false;

    window.onload = () => {
      initSceneNav();
      initSTT();
      resetChat();

      document.getElementById('speed').addEventListener('input', (e) => {
        document.getElementById('speed-val').innerText = e.target.value;
      });
    };

    function initSceneNav() {
      const nav = document.getElementById('scene-nav');
      const scenes = [
        { id: 'all', title: '🌐 전체 정주행' },
        { id: 1, title: '🎬 영화 축제' },
        { id: 2, title: '🥋 태권도 공연' },
        { id: 3, title: '🏀 레이저 & 거절' },
        { id: 4, title: '🍪 요리 교실' },
        { id: 5, title: '⭐ 별밤 파티' }
      ];

      scenes.forEach((s, idx) => {
        const btn = document.createElement('button');
        btn.className = `scene-btn ${idx === 0 ? 'active' : ''}`;
        btn.innerText = s.title;
        btn.onclick = () => {
          document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          jumpToScene(s.id);
        };
        nav.appendChild(btn);
      });
    }

    function jumpToScene(sceneId) {
      if (sceneId === 'all') {
        currentStepIdx = 0;
      } else {
        const foundIdx = dialogueFlow.findIndex(d => d.sceneId === sceneId);
        if (foundIdx !== -1) currentStepIdx = foundIdx;
      }
      resetChat(false);
    }

    function resetChat(fromStart = true) {
      if (fromStart) {
        currentStepIdx = 0;
        document.querySelectorAll('.scene-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.scene-btn')[0].classList.add('active');
      }

      document.getElementById('chat').innerHTML = '';
      updateProgress();

      const current = dialogueFlow[currentStepIdx];
      if (current.initialSystemEn) {
        setTimeout(() => {
          addMessage('system', current.initialSystemEn, current.initialSystemKr);
          speak(current.initialSystemEn);
          showUserTurnHint();
        }, 400);
      } else {
        showUserTurnHint();
      }
    }

    function updateProgress() {
      const pct = (currentStepIdx / dialogueFlow.length) * 100;
      document.getElementById('progress').style.width = `${pct}%`;
    }

    function showUserTurnHint() {
      if (currentStepIdx >= dialogueFlow.length) return;

      const current = dialogueFlow[currentStepIdx];
      
      document.getElementById('hint').innerHTML = `
        <div class="hint-title">💡 ${current.instruction}</div>
        <div style="margin-top: 5px;">
          <span class="blur-text" onclick="toggleBlur(this)">
            ${current.hintEn} <br><small>(${current.hintKr})</small>
          </span>
          <span class="blur-hint">👈 클릭해서 힌트 보기</span>
        </div>
      `;
    }

    function addMessage(sender, text, subText) {
      const chat = document.getElementById('chat');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      
      const speakerName = sender === 'system' ? '🤖 친구' : '👤 나';
      
      msgDiv.innerHTML = `
        <div class="speaker-tag">${speakerName}</div>
        <div class="bubble">
          <span class="blur-text" onclick="toggleBlur(this)">${text}</span>
        </div>
        <div class="sub-text">
          <span class="blur-text" onclick="toggleBlur(this)">${subText || ''}</span>
        </div>
      `;
      
      chat.appendChild(msgDiv);
      chat.scrollTop = chat.scrollHeight;
    }

    function toggleBlur(element) {
      element.classList.toggle('revealed');
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = parseFloat(document.getElementById('speed').value);
      window.speechSynthesis.speak(utterance);
    }

    function initSTT() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 브라우저를 사용해 주세요.');
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('mic-btn').classList.add('listening');
        document.getElementById('status').innerText = '듣고 있어요... 말씀해 주세요!';
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('mic-btn').classList.remove('listening');
        document.getElementById('status').innerText = '마이크 버튼을 누르고 영어로 말해보세요!';
      };

      recognition.onresult = (event) => {
        const userSpeech = event.results[0][0].transcript;
        handleUserSpeech(userSpeech);
      };
    }

    function toggleListening() {
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function handleUserSpeech(speech) {
      const current = dialogueFlow[currentStepIdx];
      
      addMessage('user', speech, '내가 한 말');

      const cleanSpeech = speech.toLowerCase().replace(/[^a-z0-9 ]/g, '');
      const isCorrect = current.target.some(target => cleanSpeech.includes(target.toLowerCase()));

      if (isCorrect) {
        currentStepIdx++;
        updateProgress();

        setTimeout(() => {
          addMessage('system', current.systemReplyEn, current.systemReplyKr);
          speak(current.systemReplyEn);

          if (currentStepIdx < dialogueFlow.length) {
            setTimeout(showUserTurnHint, 1800);
          } else {
            document.getElementById('progress').style.width = '100%';
            document.getElementById('hint').innerHTML = `
              <div class="hint-title">🎉 축하합니다! 7단원 전체 대화를 마스터하셨습니다!</div>
              <div>상단의 '🔄 처음부터 다시하기' 또는 원하는 장면 버튼을 누를 수 있습니다.</div>
            `;
          }
        }, 1000);

      } else {
        document.getElementById('status').innerText = '비슷한 문장으로 인식되지 않았어요. 힌트를 확인하고 다시 시도해보세요!';
      }
    }
  </script>
</body>
</html>
